  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #8B4513;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    // Camera permission helper
    async function requestCameraPermission() {
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
          // Stop the stream immediately, we just wanted to request permission
          stream.getTracks().forEach(track => track.stop());
          return true;
        }
      } catch (error) {
        console.error('Camera permission error:', error);
        return false;
      }
      return false;
    }

    // Check if HTTPS is being used
    function checkHTTPS() {
      return location.protocol === 'https:' || location.hostname === 'localhost';
    }

    // Initialize camera checks when page loads
    window.addEventListener('load', function() {
      if (!checkHTTPS() && location.hostname !== 'localhost') {
        console.warn('HTTPS required for camera access');
      }
    });
  </script>

  <!-- Vercel Analytics initialization -->
  <script>
    // Vercel Analytics tracking function
    function trackEvent(eventName, properties = {}) {
      if (window.va) {
        window.va('track', eventName, properties);
      }
    }

    // Track page views when Flutter app loads
    window.addEventListener('load', function() {
      trackEvent('app_loaded');
    });
  </script>
</head>
<body>
<picture id="splash">

  <source srcset="splash/img/dark-1x.png 2x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
  <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
</picture>
