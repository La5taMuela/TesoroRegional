name: tesoro_regional
description: "App de descubrimiento cultural para Ñuble (Chile) usando la metáfora de rompecabezas"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.3.6
  go_router: ^10.1.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  uuid: ^3.0.7

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Storage
  shared_preferences: ^2.2.0
  cached_network_image: ^3.3.0
  # Network
  dio: ^5.3.2
  connectivity_plus: ^4.0.2

  # UI
  flutter_svg: ^2.0.7

  # Camera and QR - Updated version for better web support
  mobile_scanner: ^4.0.1
  permission_handler: ^11.0.1
  qr_flutter: ^4.1.0
  encrypt: ^5.0.3

  # File handling
  gal: ^2.1.4
  path_provider: ^2.1.1
  get_it: ^8.0.3
  # Logging
  logger: ^2.0.1
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  location: ^5.0.0
  provider: ^6.0.5
  url_launcher: ^6.1.11
  injectable: ^2.5.0
  flutter_native_splash: ^2.4.6
  image_picker: ^1.0.7
  video_player: ^2.8.2
  video_thumbnail: ^0.5.3

  # Firebase - Updated to compatible versions
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_auth: ^6.1.1  # Keep this version as it's compatible with the others
  google_sign_in: ^6.2.2
  flutter_dotenv: ^5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  share_plus: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/icon/icon_app.png
    - assets/icons/
    - assets/i18n/
    - assets/initial_content/missions/
    - assets/initial_content/stories/
    - assets/initial_content/recommendations/
    - assets/initial_content/trivia/es.json
    - assets/initial_content/trivia/en.json
    - assets/initial_content/puzzle_sliders/
    - assets/initial_content/memory_cards/

    - assets/images/puzzle_slider/Catedral de San Bartolomé.jpg
    - assets/images/puzzle_slider/Mercado de Chillán.jpg
    - assets/images/puzzle_slider/Nevados de Chillán.jpg
    - assets/images/puzzle_slider/Plaza de Armas de Chillán.jpg
    - assets/images/puzzle_slider/Termas de Chillán.jpg
    - assets/images/puzzle_slider/Viñedos del Valle del Itata.jpg

    - assets/nuble_svg/
    - assets/icons/plaza_icon.png

    - .env
  generate: true

# Configuración mejorada para iconos adaptativos
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon_app.png"
  min_sdk_android: 21

  # Configuración específica para Android con iconos adaptativos
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icon/icon_app.png"

  # Configuración para web
  web:
    generate: true
    image_path: "assets/icon/icon_app.png"
    background_color: "#4CAF50"
    theme_color: "#4CAF50"

  # Configuración para diferentes tamaños de Android
  android_12:
    image_path: "assets/icon/icon_app.png"
    adaptive_icon_background: "#4CAF50"
    adaptive_icon_foreground: "assets/icon/icon_app.png"

flutter_native_splash:
  # Configuración común
  color: "#8B4513"  # Color de fondo
  image: "assets/icon/icon_app.png"  # Imagen del logo

  # Android
  android: true
  android_12:
    color: "#8B4513"
    image: "assets/icon/icon_app.png"
    icon_background_color: "#8B4513"

  # iOS
  ios: true
  ios_content_mode: center